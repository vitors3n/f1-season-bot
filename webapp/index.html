<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f1014">
    <title>F1 Season</title>
    <link rel="stylesheet" href="app.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <main class="dashboard">
      <header><p class="eyebrow">F1 SEASON</p><h1>Próximo GP</h1><p id="user" class="user" hidden></p></header>
      <section class="race-card" aria-live="polite">
        <div class="flag" aria-hidden="true">🏁</div>
        <p id="status" class="status">Carregando corrida...</p>
        <div id="race-content" hidden>
          <p class="label">PRÓXIMA CORRIDA</p><h2 id="race-name"></h2><p id="circuit" class="circuit"></p>
          <div class="race-time"><span>Corrida</span><strong id="race-date"></strong></div>
        </div>
      </section>
      <section id="schedule-section" hidden><h2>Programação do fim de semana</h2><ul id="schedule" class="schedule"></ul></section>
      <section id="top5-section" hidden>
        <h2>Seu Top 5</h2>
        <p id="top5-deadline" class="hint"></p>
        <form id="top5-form">
          <div id="top5-fields" class="top5-fields"></div>
          <button id="top5-submit" type="submit">Salvar previsão</button>
        </form>
        <p id="top5-feedback" class="hint" aria-live="polite"></p>
      </section>
      <section id="admin-section" hidden>
        <p class="eyebrow">ADMINISTRAÇÃO</p>
        <h2 id="admin-title">Resultado oficial — Top 5</h2>
        <p class="hint">Defina a ordem de chegada da última corrida. Salvar novamente substitui o resultado anterior.</p>
        <form id="admin-form">
          <div id="admin-fields" class="top5-fields"></div>
          <button type="submit">Salvar resultado oficial</button>
        </form>
        <p id="admin-feedback" class="hint" aria-live="polite"></p>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
