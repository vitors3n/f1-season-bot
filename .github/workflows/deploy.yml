name: Deploy

on:
  push:
    branches:
      - main  
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, apolo-runner]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Executar testes
        env:
          BOT_TOKEN: 123456:TESTE
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements.txt
          .venv/bin/python -m unittest discover -s tests

      - name: Validar BOT_TOKEN
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        shell: bash
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "::error::O secret BOT_TOKEN não está definido ou está vazio."
            exit 1
          fi

      - name: Build and deploy f1bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WEB_APP_URL: ${{ vars.WEB_APP_URL }}
        run: |
          docker compose -f docker/docker-compose.yml up -d --build --remove-orphans
