name: Deploy

on:
  push:
    branches:
      - main  
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, apolo-runner]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validar BOT_TOKEN
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        shell: bash
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "::error::O secret BOT_TOKEN não está definido ou está vazio."
            exit 1
          fi

      - name: Build and deploy f1bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          docker compose -f docker/docker-compose.yml up -d --build --remove-orphans
